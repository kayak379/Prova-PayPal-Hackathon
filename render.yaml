services:
  - type: web
    name: prova
    runtime: node
    region: ohio
    plan: starter
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build
    preDeployCommand: corepack pnpm db:setup
    startCommand: corepack pnpm start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        fromDatabase:
          name: prova-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
databases:
  - name: prova-db
    plan: 0.1c-256mb
    region: ohio
    diskSizeGB: 1
    databaseName: prova
    user: prova
